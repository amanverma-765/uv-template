# Install once per clone:  uvx pre-commit install
# Run against everything:  uvx pre-commit run --all-files
#
# These call the project's own ruff and mypy (the `dev` group in pyproject.toml)
# instead of versions pinned here, so there is exactly one of each and the hooks
# can never disagree with `uv run ruff` / `uv run mypy`.
repos:
  - repo: local
    hooks:
      # lint first: --fix rewrites code, and the formatter must see the result
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # mypy needs the whole package, not the changed files, to resolve imports
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
