[project]
name = "uv-template"
version = "1.0.0"
readme = "README.md"
description = "Your description here"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.14"]

[project.scripts]
uv-template = "uv_template.main:main"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# lets `python3 -m pytest` work in a bare checkout, without a synced venv
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"